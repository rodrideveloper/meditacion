name: meditation_app
description: "App de meditación con alarma full-screen"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.3

  # Local Storage
  shared_preferences: ^2.3.5

  # Audio para reproducir sonido de alarma
  just_audio: ^0.9.43
  audio_session: ^0.1.21

  # Permisos
  permission_handler: ^11.3.1

  # Utilidades
  dartz: ^0.10.1
  intl: ^0.20.2
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#1A1A2E"
  image: "assets/icon/icon.png"
  image_dark: "assets/icon/icon.png"
  color_dark: "#1A1A2E"
  android_12:
    color: "#1A1A2E"
    icon_background_color: "#1A1A2E"
    image: "assets/icon/icon.png"
    color_dark: "#1A1A2E"
    icon_background_color_dark: "#1A1A2E"
    image_dark: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
