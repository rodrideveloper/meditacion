name: meditation_app
description: "App de meditación con alarma full-screen"
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.3

  # Local Storage
  shared_preferences: ^2.3.5

  # Audio para reproducir sonido de alarma
  just_audio: ^0.9.43
  audio_session: ^0.1.21

  # Permisos
  permission_handler: ^11.3.1

  # Utilidades
  dartz: ^0.10.1
  intl: ^0.20.2

  # In-App Review (solicitar valoraciones en Play Store)
  in_app_review: ^2.0.10
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^5.0.1
  timezone: ^0.10.1
  flutter_native_splash: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/volver-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F4F0E7"
  adaptive_icon_foreground: "assets/icon/volver-icon.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#F4F0E7"
  image: "assets/icon/volver-icon.png"
  image_dark: "assets/icon/volver-icon-dark.png"
  color_dark: "#201D1A"
  android_12:
    color: "#F4F0E7"
    icon_background_color: "#F4F0E7"
    image: "assets/icon/volver-icon.png"
    color_dark: "#201D1A"
    icon_background_color_dark: "#201D1A"
    image_dark: "assets/icon/volver-icon-dark.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
